# rancherd selects Deployment/Service resources from this file and waits for
# deploy/harvester-cluster-repo. A zero-replica Deployment satisfies that path
# without running a repository container or installing Harvester charts.
resources:
- apiVersion: apps/v1
  kind: Deployment
  metadata:
    name: harvester-cluster-repo
    namespace: cattle-system
  spec:
    replicas: 0
    selector:
      matchLabels:
        app: harvester-cluster-repo
    template:
      metadata:
        labels:
          app: harvester-cluster-repo
      spec:
        containers:
        - name: placeholder
          image: registry.k8s.io/pause:3.10
