name: build
on:
  push:
    branches:
    - dev
    tags:
    - v*
  pull_request:
jobs:
  build:
    name: Build images
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - name: Set up Go build cache
      id: go-cache
      uses: ./.github/actions/setup-buildkit-go-cache

    # Build binaries and SHA files
    - name: Run make ci
      env:
        BUILDX_BUILDER: ${{ steps.go-cache.outputs.builder }}
      run: make ci MK_REPO_ID=ci

    - name: Release
      if: startsWith(github.ref, 'refs/tags/')
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release upload ${{ github.ref_name }} dist/artifacts/rancherd-amd64
        gh release upload ${{ github.ref_name }} dist/artifacts/rancherd-arm64
        gh release upload ${{ github.ref_name }} dist/artifacts/sha256sum-amd64.txt
        gh release upload ${{ github.ref_name }} dist/artifacts/sha256sum-arm64.txt

  test-cluster:
    name: Test 2-node cluster
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: [self-hosted, harvester-runners]
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    env:
      GATEWAY_URL: ${{ vars.GATEWAY_URL }}
      GATEWAY_IMAGE: ${{ vars.GATEWAY_IMAGE }}
      GATEWAY_NETWORK: ${{ vars.GATEWAY_NETWORK }}
    steps:
    - name: Checkout code
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - name: Set up Go build cache
      id: go-cache
      uses: ./.github/actions/setup-buildkit-go-cache

    - name: Build rancherd binary
      env:
        BUILDX_BUILDER: ${{ steps.go-cache.outputs.builder }}
      run: make build MK_REPO_ID=ci

    - name: Create VMs
      id: cluster
      uses: bk201-org/harvester-runner-gateway/actions/create-ci-cluster@main
      with:
        gateway-url: ${{ env.GATEWAY_URL }}
        vm-count: '2'
        image: ${{ env.GATEWAY_IMAGE }}
        network: ${{ env.GATEWAY_NETWORK }}
        cpu: '4'
        memory: 8Gi
        boot-disk-size: 40Gi
        username: ubuntu
        ttl-seconds: '7200'

    - name: Prepare nodes
      env:
        VM_IDS: ${{ steps.cluster.outputs.vm-ids }}
        CLUSTER_SSH_CONFIG: ${{ steps.cluster.outputs.ssh-config-path }}
      shell: bash
      run: bash .github/scripts/prepare-nodes.sh

    - name: Bootstrap node 1 (cluster-init)
      run: bash .github/scripts/install-node.sh cluster-init

    - name: Wait for node 1
      run: bash .github/scripts/wait-node1.sh

    - name: Join node 2 (agent)
      run: bash .github/scripts/install-node.sh agent

    - name: Wait for both nodes
      run: bash .github/scripts/wait-cluster.sh

    - name: Collect diagnostics
      if: failure()
      run: bash .github/scripts/diagnostics.sh
