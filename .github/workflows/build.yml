name: build
on:
  push:
    branches:
    - dev
    - feature/buildkit-go-cache
    tags:
    - v*
  pull_request:
jobs:
  build:
    name: Build images
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - name: Set up Go build cache
      id: go-cache
      uses: ./.github/actions/setup-buildkit-go-cache

    # Build binaries and SHA files
    - name: Run make ci
      env:
        BUILDX_BUILDER: ${{ steps.go-cache.outputs.builder }}
      run: make ci MK_REPO_ID=ci

    - name: Release
      if: startsWith(github.ref, 'refs/tags/')
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release upload ${{ github.ref_name }} dist/artifacts/rancherd-amd64
        gh release upload ${{ github.ref_name }} dist/artifacts/rancherd-arm64
        gh release upload ${{ github.ref_name }} dist/artifacts/sha256sum-amd64.txt
        gh release upload ${{ github.ref_name }} dist/artifacts/sha256sum-arm64.txt

  test-cluster:
    name: Test 2-node cluster
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: [self-hosted, harvester-runners]
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    env:
      GATEWAY_URL: ${{ vars.GATEWAY_URL }}
      GATEWAY_IMAGE: ${{ vars.GATEWAY_IMAGE }}
      GATEWAY_NETWORK: ${{ vars.GATEWAY_NETWORK }}
    steps:
    - name: Checkout code
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - name: Set up Go build cache
      id: go-cache
      uses: ./.github/actions/setup-buildkit-go-cache

    - name: Build rancherd binary
      env:
        BUILDX_BUILDER: ${{ steps.go-cache.outputs.builder }}
      run: make build MK_REPO_ID=ci
